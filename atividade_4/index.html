<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 4 - Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>Cadastro de Produtos</h1>
            <p>Mini-sistema desenvolvido com JavaScript, objetos, arrays, JSON e localStorage.</p>
        </header>

        <section class="card">
            <h2>Novo produto</h2>

            <form id="formProduto">
                <div class="campo">
                    <label for="nome">Nome do produto</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <input type="text" id="categoria" required>
                </div>

                <div class="linha">
                    <div class="campo">
                        <label for="preco">Preço (R$)</label>
                        <input type="number" id="preco" min="0" step="0.01" required>
                    </div>

                    <div class="campo">
                        <label for="quantidade">Quantidade</label>
                        <input type="number" id="quantidade" min="0" step="1" required>
                    </div>
                </div>

                <button type="submit">Cadastrar produto</button>
            </form>
        </section>

        <section class="card">
            <div class="titulo-lista">
                <h2>Produtos cadastrados</h2>
                <button id="btnLimpar" class="btn-limpar" type="button">Limpar registros</button>
            </div>

            <div id="listaProdutos" class="lista">
                <p class="vazio">Nenhum produto cadastrado.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
